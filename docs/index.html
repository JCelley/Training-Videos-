<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APW Training Videos</title>
<link rel="icon" href="apw_logo.png">
<style>
  :root {
    --dark: #0a0f1a;
    --mid: #111827;
    --panel: #1a2234;
    --border: #243050;
    --text: #e8edf5;
    --muted: #8593b3;
    --logo: #689dcc;
    --accent: #00aaff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--dark);
    color: var(--text);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  a { color: inherit; }
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--mid);
  }
  header img { height: 44px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  header .count { margin-left: auto; color: var(--muted); font-size: 14px; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 32px 64px; }

  /* Player */
  #player[hidden] { display: none; }
  #player { margin-bottom: 36px; }
  #player .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 0; color: var(--logo); cursor: pointer;
    font: inherit; font-size: 14px; padding: 0; margin-bottom: 14px;
  }
  #player .back:hover { color: var(--accent); }
  #player video {
    width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 8px; border: 1px solid var(--border); display: block;
  }
  #player h2 { font-size: 26px; margin: 18px 0 4px; }
  #player .meta { color: var(--muted); font-size: 14px; }
  #player p { max-width: 70ch; margin: 10px 0 0; }

  /* Filters */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
  .chip {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip:hover { border-color: var(--logo); }
  .chip[aria-pressed="true"] { background: var(--logo); border-color: var(--logo); color: var(--dark); font-weight: 600; }
  #search {
    margin-left: auto; min-width: 220px;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 12px; font: inherit; font-size: 14px;
  }
  #search:focus, .chip:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
  .card {
    display: block; text-decoration: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--logo); transform: translateY(-2px); }
  .card.playing { border-color: var(--accent); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur {
    position: absolute; right: 8px; bottom: 8px;
    background: rgba(0, 0, 0, 0.8); font-size: 12px; padding: 1px 6px; border-radius: 4px;
  }
  .card .body { padding: 12px 14px 16px; }
  .topic { color: var(--logo); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .card h3 { font-size: 17px; margin: 4px 0 6px; }
  .card p { color: var(--muted); font-size: 14px; margin: 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    #search { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <img src="apw_logo.png" alt="American Precision Works">
  <h1>Training Videos</h1>
  <span class="count" id="count"></span>
</header>

<main>
  <section id="player" hidden aria-live="polite">
    <button class="back" id="back" type="button">&larr; All videos</button>
    <video id="video" controls playsinline preload="metadata"></video>
    <h2 id="p-title"></h2>
    <div class="meta" id="p-meta"></div>
    <p id="p-desc"></p>
  </section>

  <div class="controls">
    <div id="topics" role="group" aria-label="Filter by topic"></div>
    <input id="search" type="search" placeholder="Search videos" aria-label="Search videos">
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No videos match.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let videos = [];
let topic = "All";

const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTopics() {
  const topics = ["All", ...new Set(videos.map((v) => v.topic).filter(Boolean))];
  $("topics").innerHTML = topics.map((t) =>
    `<button class="chip" type="button" aria-pressed="${t === topic}" data-topic="${esc(t)}">${esc(t)}</button>`
  ).join(" ");
}

function renderGrid() {
  const q = $("search").value.trim().toLowerCase();
  const current = location.hash.slice(1);
  const shown = videos.filter((v) =>
    (topic === "All" || v.topic === topic) &&
    (!q || `${v.title} ${v.description} ${v.topic}`.toLowerCase().includes(q)));
  $("grid").innerHTML = shown.map((v) => `
    <a class="card${v.id === current ? " playing" : ""}" href="#${esc(v.id)}">
      <div class="thumb">
        <img src="${esc(v.poster)}" alt="" loading="lazy">
        <span class="dur">${fmt(v.duration)}</span>
      </div>
      <div class="body">
        <div class="topic">${esc(v.topic || "")}</div>
        <h3>${esc(v.title)}</h3>
        <p>${esc(v.description || "")}</p>
      </div>
    </a>`).join("");
  $("empty").hidden = shown.length > 0;
}

function showFromHash() {
  const v = videos.find((x) => x.id === location.hash.slice(1));
  const video = $("video");
  if (!v) {
    video.pause();
    $("player").hidden = true;
    renderGrid();
    return;
  }
  if (video.dataset.id !== v.id) {
    video.dataset.id = v.id;
    video.poster = v.poster;
    video.innerHTML = `<source src="${esc(v.video)}" type="video/mp4">` +
      (v.captions ? `<track kind="captions" src="${esc(v.captions)}" srclang="en" label="English" default>` : "");
    video.load();
  }
  $("p-title").textContent = v.title;
  $("p-meta").textContent = [v.topic, fmt(v.duration)].filter(Boolean).join(" · ");
  $("p-desc").textContent = v.description || "";
  $("player").hidden = false;
  document.title = `${v.title} | APW Training Videos`;
  renderGrid();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("topics").addEventListener("click", (e) => {
  const b = e.target.closest("[data-topic]");
  if (!b) return;
  topic = b.dataset.topic;
  renderTopics();
  renderGrid();
});
$("search").addEventListener("input", renderGrid);
$("back").addEventListener("click", () => {
  history.pushState("", "", location.pathname);
  document.title = "APW Training Videos";
  showFromHash();
});
window.addEventListener("hashchange", showFromHash);

fetch("library.json", { cache: "no-cache" })
  .then((r) => r.json())
  .then((data) => {
    videos = data.videos;
    $("count").textContent = `${videos.length} video${videos.length === 1 ? "" : "s"}`;
    renderTopics();
    showFromHash();
  })
  .catch(() => {
    $("grid").innerHTML = "";
    $("empty").textContent = "Couldn't load the video list.";
    $("empty").hidden = false;
  });
</script>
</body>
</html>
